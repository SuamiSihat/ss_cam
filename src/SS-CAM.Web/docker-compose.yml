version: '3.8'

services:
  ss-cam-web-portal:
    image: node:20-alpine
    container_name: ss-cam-web-portal
    restart: always
    working_dir: /app
    # Published on this machine only: the Synology reverse proxy (HTTPS) is the public entry point.
    # Reaching port 4000 directly would bypass HTTPS and let callers spoof their address (which the
    # sign-in limits rely on). Set PORTAL_BIND=0.0.0.0 in .env only if a client must connect directly.
    ports:
      - "${PORTAL_BIND:-127.0.0.1}:4000:4000"
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - PORT=4000
      - NODE_ENV=production
      - WORKSPACE_ROOT=/data/Creative-Team
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be configured in .env}
      - DATA_DIR=/app/data
    volumes:
      # Application files from your NAS docker folder (Read-Write enabled)
      - /volume1/docker/ss-cam-web:/app:rw

      # Shared Creative-Team storage on Volume 2
      - /volume2/Creative-Team:/data/Creative-Team:rw

    # --ignore-scripts: dependency install scripts never run on the NAS.
    command: sh -c "cd /app && npm install --omit=dev --ignore-scripts --no-audit --no-fund && node server/index.js"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/status').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
